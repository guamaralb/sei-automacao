[project]
name = "sei-automacao"
version = "0.1.0"
description = ""
authors = [
    { name = "Gustavo Amaral Bernardino", email = "gu.amaralb@gmail.com" }
]
readme = "README.md"

[tool.poetry]
packages = [
    { include = "sei_automacao" }
]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
selenium = "^4.39.0"
webdriver-manager = "^4.0.2"
num2words = ">=0.5.14,<0.6.0"


[tool.poetry.group.dev.dependencies]
taskipy = "^1.14.1"
ruff = "^0.14.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.taskipy.tasks]
lint = {cmd = 'poetry run ruff check'}
pre_format = {cmd = 'poetry run ruff check --fix'}
format = {cmd = 'poetry run ruff format'}

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'single'