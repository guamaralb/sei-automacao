[project]
name = "sei-automacao"
version = "0.1.0"
description = "Automação do SEI (Sistema Eletrônico de Informações) com Selenium: login, unidade, processos, documentos e marcadores."
authors = [
    { name = "Gustavo Amaral Bernardino", email = "gu.amaralb@gmail.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "selenium>=4.39.0,<5",
    "webdriver-manager>=4.0.2,<5",
    "num2words>=0.5.14,<0.6.0",
]
keywords = ["sei", "selenium", "automacao", "rpa", "governo", "processo-eletronico"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/guamaralb/sei-automacao"
Repository = "https://github.com/guamaralb/sei-automacao"
Issues = "https://github.com/guamaralb/sei-automacao/issues"
Changelog = "https://github.com/guamaralb/sei-automacao/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "taskipy>=1.14.1,<2",
    "ruff>=0.14.13,<0.15",
    "pytest>=9.1.1,<10",
    "python-dotenv>=1.2.1,<2",
]

[tool.poetry]
packages = [
    { include = "sei_automacao", from = "src" }
]

[tool.poetry.dependencies]
# Só restringe a resolução do lock (o taskipy exige <4); o pacote publicado
# continua com requires-python = ">=3.10"
python = ">=3.10,<4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.taskipy.tasks]
lint = {cmd = 'ruff check'}
pre_format = {cmd = 'ruff check --fix'}
format = {cmd = 'ruff format'}
test = {cmd = 'pytest -v'}
pre_test = {cmd = 'task format'}
test_integracao = {cmd = 'pytest -v -s -m integracao'}

[tool.pytest.ini_options]
testpaths = ['tests', 'src']
addopts = '-m "not integracao" --doctest-modules --import-mode=importlib'
markers = [
    'integracao: usa o SEI real (precisa de .env com SEI_URL, SEI_LOGIN, SEI_SENHA, SEI_ORGAO e SEI_UNIDADE)',
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.lint.per-file-ignores]
# Os testes inspecionam a API privada e usam valores literais
'tests/*' = ['PLC2701', 'PLR6301', 'PLR2004']

[tool.ruff.format]
preview = true
quote-style = 'single'
